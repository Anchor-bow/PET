services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pet
    ports:
      - "5432:5432"
    volumes:
      - pet-pgdata:/var/lib/postgresql/data

volumes:
  pet-pgdata:
