appId: com.pet.desktop
productName: PET App
copyright: Copyright © PET

directories:
  output: dist/installer
  buildResources: build

files:
  - dist/electron/**/*
  - dist/renderer/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
